# INSERT_NUT, dry run, for Klipper.
#
# The nut inserter plugin for OrcaSlicer writes one line per nut into the G-code:
#
#   INSERT_NUT KEY=M3SQ CLASS=FLAT X=164.706 Y=158.320 Z=1.900 Z_LOW=1.000 YAW=0.00 FEEDER=1 TOOL=0
#
# This macro places nothing. It checks the values, reports them in the console,
# and pauses the print, so you can see that every nut is called at the right
# layer and position before a real nut tool is involved. RESUME continues.
#
# It has not been run on a printer. Try it first with a small test print and a
# hand near the emergency stop.
#
# Requirements:
#   - [pause_resume] and working PAUSE and RESUME macros. Mainsail's and Fluidd's
#     client.cfg provide them. PAUSE retracts and parks the print tool; RESUME
#     brings it back to where it stopped, primed, with the positioning and
#     extruder modes as they were. That is what the plugin expects of the macro.
#
# Install: copy this file next to printer.cfg and add
#   [include insert_nut_dry_run.cfg]
# then restart Klipper.
#
# What the values mean (bed coordinates, mm, as printed):
#   X, Y    centre of the pocket
#   Z       centre of the seated nut
#   Z_LOW   lowest point of the seated nut: the pocket floor for a flat nut
#   YAW     flat nut: rotation of the flats about Z, 0 to 90 degrees
#           nut on edge or corner: heading of the thread axis, 0 to 180 degrees
#   CLASS   FLAT, EDGE or CORNER
#   FEEDER  feeder number from the nut library
#   TOOL    the print tool that was active, or -1 if the file never selected one

[gcode_macro INSERT_NUT]
description: Nut insert, DRY RUN. Reports the nut and pauses. RESUME continues the print.
gcode:
    {% set key = params.KEY|default("?") %}
    {% set cls = params.CLASS|default("?") %}
    {% set x = params.X|default(-1)|float %}
    {% set y = params.Y|default(-1)|float %}
    {% set z = params.Z|default(-1)|float %}
    {% set z_low = params.Z_LOW|default(-1)|float %}
    {% set yaw = params.YAW|default(0)|float %}
    {% set feeder = params.FEEDER|default(0)|int %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set th = printer.toolhead %}

    {% if x < th.axis_minimum.x or x > th.axis_maximum.x or y < th.axis_minimum.y or y > th.axis_maximum.y %}
        { action_raise_error("INSERT_NUT: X%.3f Y%.3f is outside the printer's travel" % (x, y)) }
    {% endif %}
    {% if z_low < 0 or z < z_low %}
        { action_raise_error("INSERT_NUT: Z%.3f and Z_LOW%.3f do not make sense" % (z, z_low)) }
    {% endif %}
    {% if th.position.z < z %}
        { action_raise_error("INSERT_NUT: the nozzle is at Z%.3f, below the nut centre Z%.3f" % (th.position.z, z)) }
    {% endif %}

    { action_respond_info("INSERT_NUT dry run: %s, %s, pocket centre X%.3f Y%.3f, nut centre Z%.3f, lowest point Z%.3f, angle %.2f, feeder %d, print tool %d. Nozzle is at Z%.3f. Paused: RESUME to continue." % (key, cls, x, y, z, z_low, yaw, feeder, tool, th.position.z)) }
    PAUSE

# Outline of the real macro, for when the nut tool exists. Not usable as is.
#
#   SAVE_GCODE_STATE NAME=insert_nut        ; position, G90/G91, M82/M83, speed
#   ... retract the print tool and lift it clear of the part ...
#   ... change to the nut tool, pick a nut from feeder FEEDER ...
#   G90
#   G0 X{x} Y{y}                            ; plus your nut tool's offset
#   ... turn the nut to YAW, lower it to Z or Z_LOW, release, check the seat ...
#   ... change back to print tool TOOL and prime it ...
#   RESTORE_GCODE_STATE NAME=insert_nut MOVE=1 MOVE_SPEED=150

[project]
name = "nut-inserter"
version = "0.2.2"
description = "OrcaSlicer 2.5 plugin that finds NUT_ bodies, checks their pockets and writes nut-insert commands"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nut_inserter", "src/nutcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/fake_orca"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/nut_inserter/ui_*.py" = ["E501"]   # HTML pages kept as strings
"probe/*.py" = ["E501"]                 # holds one HTML page as a string

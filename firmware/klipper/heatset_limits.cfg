# Heat-set tool: hard limits and wiring, for heatset_macros.cfg.
#
# Include it in printer.cfg beside heatset.cfg (the hardware) and heatset_macros.cfg:
#   [include heatset_limits.cfg]
#
# The G-code passes thresholds and these cap them; G-code never changes them
# (docs/HEATSET_GCODE_SPEC.md, "Failures and safety limits"). Edit the values here.
# Run _HS_LIMITS from the console to see them.

[gcode_macro _HS_LIMITS]
description: Heat-set tool hard limits and wiring
variable_max_temp: 290.0          # C: the throat at most. Keep max_temp of the heater at or below it
variable_max_tick: 0.5            # mm of A in one push tick
variable_max_push: 8.0            # mm of A in one push
variable_max_unsheath: 2.0        # mm in one unsheath move, and in one follower retract
variable_max_wait: 10.0           # s: any dwell or wait the G-code asks for
variable_max_speed: 5.0           # mm/s: probe and press speeds
variable_temp_settle: 60          # s to reach the insert temperature before pausing
variable_standby_temp: 0.0        # C: the throat after a stop and between blocks. 0 is off
variable_lift_speed: 10.0         # mm/s: lifts the macros make on their own
variable_heater: 'hs_throat'      # the [heater_generic] of the throat
variable_follower: 'hs_follower'  # the [manual_stepper] of the follower, axis A during prints
variable_pause_command: 'PAUSE_BASE'  # a pause that does not park: PAUSE_BASE with the Mainsail or Fluidd macros, else PAUSE
variable_led: ''                  # a [neopixel] or [led] name for status colours, or '' for none
gcode:
  RESPOND MSG="Heat-set limits: throat {max_temp} C, tick {max_tick} mm, push {max_push} mm, unsheath {max_unsheath} mm, waits {max_wait} s, probe and press {max_speed} mm/s"
  RESPOND MSG="Heat-set wiring: heater {heater}, follower {follower}, pause {pause_command}, led {led if led else 'none'}"

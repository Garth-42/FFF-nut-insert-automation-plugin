# Heat-set insert commands for Klipper: the commands the G-code from the nut inserter
# plugin calls (docs/HEATSET_GCODE_SPEC.md, "Firmware commands (Klipper)").
#
# Include it in printer.cfg after heatset.cfg (the hardware) and heatset_limits.cfg:
#   [include heatset_macros.cfg]
# What heatset.cfg must define, and how to bring the tool up: firmware/klipper/README.md.
#
# Not yet run on a printer. Klipper renders a macro before running any of it, so a macro
# never acts on a result it causes: it runs the action and calls a follow-up macro, which
# renders when it is called (the _HS_..._GO and _HS_..._DONE pairs below).

[gcode_macro _HS_STATE]
description: Heat-set routine state (internal)
variable_configured: False
variable_key: ''
variable_tool: -1
variable_pad_drop: 0.0
variable_overtravel: 0.0
variable_surface_tol: 0.0
variable_temp_window: 0.0
variable_on_proud: 'warn'
variable_mode: 'normal'
variable_rehearse_lift: 0.0
variable_temp: 0.0
variable_left: 0
variable_in_block: False
variable_prev_tool: -1
variable_z_safe: 0.0
variable_index: 0
variable_object: ''
variable_x: 0.0
variable_y: 0.0
variable_z_top: 0.0
variable_skip: False
variable_probed: False
variable_z_trip1: 0.0
variable_s: 0.0
variable_total: 0.0
variable_step: 0.0
variable_speed: 0.0
variable_wait: 0.0
variable_maxwaits: 0
variable_progress: 0.0
variable_waits: 0
variable_done: False
variable_proud: 0.0
variable_temp_ok: False
gcode:
  RESPOND MSG="Heat-set: {mode} mode, key {key}, in a block {in_block}, insert {index}, skipped {skip}, surface {s}, push {progress} of {total}"

[gcode_macro _HS_SET]
description: Set heat-set state (internal): NAME=VALUE, each value a Python literal
gcode:
  {% for name in params %}
    SET_GCODE_VARIABLE MACRO=_HS_STATE VARIABLE={name|lower} VALUE={params[name]}
  {% endfor %}

[gcode_macro _HS_LED]
description: Heat-set status colour (internal): COLOR=red, amber, green or off
gcode:
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set color = params.COLOR|default('off')|lower %}
  {% if lim.led %}
    {% if color == 'red' %}
      SET_LED LED={lim.led} RED=1 GREEN=0 BLUE=0
    {% elif color == 'amber' %}
      SET_LED LED={lim.led} RED=1 GREEN=0.5 BLUE=0
    {% elif color == 'green' %}
      SET_LED LED={lim.led} RED=0 GREEN=1 BLUE=0
    {% else %}
      SET_LED LED={lim.led} RED=0 GREEN=0 BLUE=0
    {% endif %}
  {% endif %}

[gcode_macro _HS_PAUSE]
description: Heat-set: report and pause without parking (internal). REASON= [COLOR=]
gcode:
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  RESPOND TYPE=error MSG="Heat-set: {params.REASON|default('paused')}"
  _HS_LED COLOR={params.COLOR|default('red')}
  {lim.pause_command}

[gcode_macro _HS_ABORT]
description: Heat-set: stop the insert, lift it clear and pause (internal). REASON=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set z = printer.gcode_move.gcode_position.z %}
  _HS_SET SKIP=True
  SET_HEATER_TEMPERATURE HEATER={lim.heater} TARGET={lim.standby_temp if st.mode == 'normal' else 0}
  {% if st.in_block and z < st.z_safe %}
    G90
    G0 Z{st.z_safe} F{lim.lift_speed * 60}
    M400
  {% endif %}
  _HS_PAUSE REASON="insert {st.index} stopped, {params.REASON|default('')}. It is skipped. Resume goes on without it"

# --- The header -----------------------------------------------------------------------------

[gcode_macro HEATSET_CONFIG]
description: Heat-set header: check the profile values and keep them for this print
gcode:
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set mode = params.MODE|default('')|lower %}
  {% set on_proud = params.ON_PROUD|default('')|lower %}
  {% set tool = params.TOOL|default(-1)|int %}
  {% set p = params.PAD_DROP|default(-1)|float %}
  {% set delta = params.TRIP_OVERTRAVEL|default(-1)|float %}
  {% set tol = params.SURFACE_TOL|default(-1)|float %}
  {% set window = params.TEMP_WINDOW|default(-1)|float %}
  {% set lift = params.REHEARSE_LIFT|default(-1)|float %}
  {% if not params.KEY %}
    { action_raise_error("HEATSET_CONFIG: KEY is required") }
  {% elif mode not in ('normal', 'rehearse') %}
    { action_raise_error("HEATSET_CONFIG: MODE must be normal or rehearse") }
  {% elif on_proud not in ('warn', 'pause') %}
    { action_raise_error("HEATSET_CONFIG: ON_PROUD must be warn or pause") }
  {% elif p <= 0 or delta < 0 or tol <= 0 or window <= 0 or lift < 0 %}
    { action_raise_error("HEATSET_CONFIG: PAD_DROP, SURFACE_TOL and TEMP_WINDOW must be over 0, TRIP_OVERTRAVEL and REHEARSE_LIFT 0 or more") }
  {% elif ('heater_generic ' ~ lim.heater) not in printer %}
    { action_raise_error("HEATSET_CONFIG: no [heater_generic " ~ lim.heater ~ "], see heatset_limits.cfg") }
  {% elif 'probe' not in printer %}
    { action_raise_error("HEATSET_CONFIG: no probe for the float") }
  {% elif 'save_variables' not in printer %}
    { action_raise_error("HEATSET_CONFIG: add [save_variables] for the magazine count") }
  {% elif 'toolchanger' not in printer or tool not in printer.toolchanger.tool_numbers %}
    { action_raise_error("HEATSET_CONFIG: tool " ~ tool ~ " has no tool_number in the toolchanger") }
  {% endif %}
  _HS_SET CONFIGURED=True TOOL={tool} PAD_DROP={p} OVERTRAVEL={delta} SURFACE_TOL={tol} TEMP_WINDOW={window} REHEARSE_LIFT={lift}
  _HS_SET TEMP=0.0 LEFT=0 IN_BLOCK=False SKIP=False
  SET_GCODE_VARIABLE MACRO=_HS_STATE VARIABLE=key VALUE='"{params.KEY}"'
  SET_GCODE_VARIABLE MACRO=_HS_STATE VARIABLE=mode VALUE='"{mode}"'
  SET_GCODE_VARIABLE MACRO=_HS_STATE VARIABLE=on_proud VALUE='"{on_proud}"'
  {% if mode == 'normal' and 'A' not in printer.gcode_move.axis_map %}
    MANUAL_STEPPER STEPPER={lim.follower} GCODE_AXIS=A
  {% endif %}
  RESPOND MSG="Heat-set: {mode} mode, key {params.KEY}, tool {tool}"

[gcode_macro HEATSET_REQUIRE]
description: Heat-set header: the key, the insert temperature and enough inserts for the print
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set sv = printer.save_variables.variables %}
  {% set count = params.COUNT|default(0)|int %}
  {% set temp = params.TEMP|default(0)|float %}
  {% if not st.configured %}
    { action_raise_error("HEATSET_REQUIRE: HEATSET_CONFIG has not run") }
  {% elif params.KEY != st.key %}
    { action_raise_error("HEATSET_REQUIRE: key " ~ params.KEY ~ " is not the header's " ~ st.key) }
  {% elif temp <= 0 or temp > lim.max_temp %}
    { action_raise_error("HEATSET_REQUIRE: " ~ temp ~ " C is outside the limit of " ~ lim.max_temp ~ " C") }
  {% elif count < 1 %}
    { action_raise_error("HEATSET_REQUIRE: COUNT must be 1 or more") }
  {% endif %}
  _HS_SET TEMP={temp} LEFT={count}
  RESPOND MSG="Heat-set: the print has {count} insert(s), at {temp} C"
  {% if st.mode == 'normal' %}
    {% set have = sv.hs_count|default(0) if sv.hs_key|default('') == st.key else 0 %}
    {% if have < count %}
      _HS_PAUSE REASON="the magazine has {have} {st.key} inserts and the print needs {count}. Load them, run HEATSET_REFILL KEY={st.key} COUNT=n, then resume"
    {% endif %}
  {% endif %}

[gcode_macro HEATSET_PREHEAT]
description: Heat-set: start heating the throat ahead of a block, without waiting
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set temp = params.TEMP|default(0)|float %}
  {% if not st.configured %}
    { action_raise_error("HEATSET_PREHEAT: HEATSET_CONFIG has not run") }
  {% elif temp <= 0 or temp > lim.max_temp %}
    { action_raise_error("HEATSET_PREHEAT: " ~ temp ~ " C is outside the limit of " ~ lim.max_temp ~ " C") }
  {% endif %}
  {% if st.mode == 'normal' %}
    SET_HEATER_TEMPERATURE HEATER={lim.heater} TARGET={temp}
  {% endif %}

# --- A block --------------------------------------------------------------------------------

[gcode_macro HEATSET_BEGIN]
description: Heat-set block start: save the state and tool, lift, select the heat-set tool
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set temp = params.TEMP|default(0)|float %}
  {% set z_safe = params.Z_SAFE|default(0)|float %}
  {% set count = params.COUNT|default(1)|int %}
  {% set z = printer.gcode_move.gcode_position.z %}
  {% if not st.configured %}
    { action_raise_error("HEATSET_BEGIN: HEATSET_CONFIG has not run") }
  {% elif st.in_block %}
    { action_raise_error("HEATSET_BEGIN: the last block never ended (HEATSET_END)") }
  {% elif params.KEY != st.key %}
    { action_raise_error("HEATSET_BEGIN: key " ~ params.KEY ~ " is not the header's " ~ st.key) }
  {% elif temp <= 0 or temp > lim.max_temp %}
    { action_raise_error("HEATSET_BEGIN: " ~ temp ~ " C is outside the limit of " ~ lim.max_temp ~ " C") }
  {% endif %}
  SAVE_GCODE_STATE NAME=_HS_BLOCK
  _HS_SET IN_BLOCK=True SKIP=False Z_SAFE={z_safe} TEMP={temp} PREV_TOOL={printer.toolchanger.tool_number}
  G90
  {% if z < z_safe %}
    G0 Z{z_safe} F{lim.lift_speed * 60}
  {% endif %}
  T{st.tool}
  {% if st.mode == 'normal' %}
    SET_HEATER_TEMPERATURE HEATER={lim.heater} TARGET={temp}
    _HS_WAIT_TEMP
    _HS_STOCK COUNT={count}
  {% else %}
    SET_HEATER_TEMPERATURE HEATER={lim.heater} TARGET=0
  {% endif %}
  RESPOND MSG="Heat-set: block of {count} insert(s), {st.mode} mode"

[gcode_macro HEATSET_END]
description: Heat-set block end: lift, give the print back to the saved tool, restore the state
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set z = printer.gcode_move.gcode_position.z %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_END: no block to end (HEATSET_BEGIN)") }
  {% endif %}
  G90
  {% if z < st.z_safe %}
    G0 Z{st.z_safe} F{lim.lift_speed * 60}
  {% endif %}
  {% if printer.toolchanger.tool_number != st.prev_tool %}
    {% if st.prev_tool >= 0 %}
      T{st.prev_tool}
    {% else %}
      UNSELECT_TOOL
    {% endif %}
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER={lim.heater} TARGET={lim.standby_temp if st.left > 0 and st.mode == 'normal' else 0}
  RESTORE_GCODE_STATE NAME=_HS_BLOCK
  _HS_SET IN_BLOCK=False SKIP=False
  _HS_LED COLOR=off

# --- Checks the routine shares --------------------------------------------------------------

[gcode_macro _HS_STOCK]
description: Heat-set: pause with a refill prompt while the magazine is short (internal). COUNT=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set sv = printer.save_variables.variables %}
  {% set have = sv.hs_count|default(0) if sv.hs_key|default('') == st.key else 0 %}
  {% if st.mode == 'normal' and not st.skip and have < params.COUNT|default(1)|int %}
    _HS_PAUSE REASON="the magazine has {have} {st.key} inserts and needs {params.COUNT}. Load them, run HEATSET_REFILL KEY={st.key} COUNT=n, then resume"
  {% endif %}

[gcode_macro _HS_WAIT_TEMP]
description: Heat-set: wait for the throat, up to temp_settle seconds, then pause (internal)
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% if st.mode == 'normal' and not st.skip %}
    _HS_SET TEMP_OK=False
    {% for second in range(lim.temp_settle|int) %}
      _HS_TEMP_TICK
    {% endfor %}
    _HS_TEMP_END
  {% endif %}

[gcode_macro _HS_TEMP_TICK]
description: Heat-set: one second of the throat wait (internal)
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% if not st.temp_ok %}
    {% set now = printer["heater_generic " ~ lim.heater].temperature %}
    {% if (now - st.temp)|abs <= st.temp_window %}
      _HS_SET TEMP_OK=True
    {% else %}
      G4 P1000
    {% endif %}
  {% endif %}

[gcode_macro _HS_TEMP_END]
description: Heat-set: pause when the throat did not reach the insert temperature (internal)
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set now = printer["heater_generic " ~ lim.heater].temperature %}
  {% if not st.temp_ok and (now - st.temp)|abs > st.temp_window %}
    _HS_PAUSE REASON="the throat is at {now|round(1)} C and needs {st.temp} C within {st.temp_window} C. Resume once it is"
  {% endif %}

[gcode_macro _HS_CHECK_OPEN]
description: Heat-set: stop the insert when the float reads tripped (internal), after QUERY_PROBE
gcode:
  {% if printer.probe.last_query %}
    _HS_ABORT REASON="the float reads tripped before {params.WHAT|default('the probe')}, stuck float or debris"
  {% endif %}

# --- One insert -----------------------------------------------------------------------------

[gcode_macro HEATSET_INSERT_START]
description: Heat-set step 1: reset the insert, skip it if its object is excluded, heat and check
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_INSERT_START: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% set object = params.OBJECT|default('') %}
  {% set excluded = 'exclude_object' in printer and object|upper in printer.exclude_object.excluded_objects %}
  _HS_SET INDEX={params.INDEX|default(0)|int} X={params.X|default(0)|float} Y={params.Y|default(0)|float} Z_TOP={params.Z_TOP|default(0)|float}
  _HS_SET SKIP={excluded} PROBED=False WAITS=0 PROUD=0.0 PROGRESS=0.0 TOTAL=0.0 DONE=False
  SET_GCODE_VARIABLE MACRO=_HS_STATE VARIABLE=object VALUE='"{object|replace("'", "")|replace('"', '')}"'
  {% if excluded %}
    RESPOND MSG="Heat-set: insert {params.INDEX} skipped, its object is excluded"
  {% elif st.mode == 'normal' %}
    SET_HEATER_TEMPERATURE HEATER={printer["gcode_macro _HS_LIMITS"].heater} TARGET={st.temp}
    _HS_STOCK COUNT=1
    _HS_WAIT_TEMP
    QUERY_PROBE
    _HS_CHECK_OPEN WHAT="the probe"
  {% endif %}

[gcode_macro HEATSET_PROBE]
description: Heat-set step 4: lower until the float trips and take the surface from it. SPEED=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set sv = printer.save_variables.variables %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_PROBE: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip %}
  {% elif st.mode != 'normal' %}
    {% set s = st.z_top + st.rehearse_lift %}
    _HS_SET S={s} Z_TRIP1={s - st.overtravel + st.pad_drop} PROBED=True
    RESPOND MSG="Heat-set: insert {st.index}, rehearse, surface taken as Z{s}"
  {% else %}
    {% set now = printer["heater_generic " ~ lim.heater].temperature %}
    {% if (now - st.temp)|abs > st.temp_window %}
      _HS_ABORT REASON="the throat is at {now|round(1)} C and needs {st.temp} C"
    {% elif sv.hs_count|default(0) < 1 %}
      _HS_ABORT REASON="the magazine is empty"
    {% else %}
      QUERY_PROBE
      _HS_PROBE_GO SPEED={[params.SPEED|default(1)|float, lim.max_speed]|min}
    {% endif %}
  {% endif %}

[gcode_macro _HS_PROBE_GO]
description: Heat-set: probe the surface once the float reads open (internal)
gcode:
  {% if printer.probe.last_query %}
    _HS_ABORT REASON="the float reads tripped before the probe, stuck float or debris"
  {% else %}
    PROBE SAMPLES=1 PROBE_SPEED={params.SPEED}
    _HS_PROBE_DONE
  {% endif %}

[gcode_macro _HS_PROBE_DONE]
description: Heat-set: keep the trip height and the surface, check it against z_top (internal)
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set z = printer.gcode_move.gcode_position.z %}
  {% set s = z + st.overtravel - st.pad_drop %}
  _HS_SET Z_TRIP1={z} S={s} PROBED=True
  {% if (s - st.z_top)|abs > st.surface_tol %}
    _HS_ABORT REASON="the surface is at Z{s|round(3)}, not Z{st.z_top}. Part moved, warped or wrong layer"
  {% endif %}

[gcode_macro HEATSET_Z]
description: Heat-set: the mouth to HEIGHT above the probed surface, at SPEED mm/s
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_Z: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip %}
  {% elif not st.probed %}
    _HS_ABORT REASON="HEATSET_Z ran before the surface was probed"
  {% else %}
    G90
    G0 Z{st.s + params.HEIGHT|float} F{params.SPEED|float * 60}
  {% endif %}

[gcode_macro _HS_PUSH_START]
description: Heat-set step 6: start the hot push. TOTAL= STEP= SPEED= WAIT= MAXWAITS=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set sv = printer.save_variables.variables %}
  {% set total = params.TOTAL|default(0)|float %}
  {% set step = params.STEP|default(0)|float %}
  {% set speed = params.SPEED|default(0)|float %}
  {% set pending = sv.hs_pending|default(0.0) %}
  {% if not st.in_block %}
    { action_raise_error("_HS_PUSH_START: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip %}
  {% elif total <= 0 or total > lim.max_push %}
    _HS_ABORT REASON="a push of {total} mm is outside 0 to {lim.max_push} mm"
  {% elif step <= 0 or step > lim.max_tick %}
    _HS_ABORT REASON="a push step of {step} mm is outside 0 to {lim.max_tick} mm"
  {% elif st.mode != 'normal' %}
    _HS_SET TOTAL={total} STEP={step} PROGRESS={total} WAITS=0 DONE=True
    RESPOND MSG="Heat-set: insert {st.index}, rehearse, push of {total} mm left out"
  {% else %}
    _HS_SET TOTAL={total} STEP={step} SPEED={speed} WAIT={[params.WAIT|default(0)|float, lim.max_wait]|min} MAXWAITS={params.MAXWAITS|default(0)|int} PROGRESS=0.0 WAITS=0 DONE=False
    {% if pending > 0 %}
      G91
      G1 A{pending} F{speed * 60}
      G90
      M400
      SAVE_VARIABLE VARIABLE=hs_pending VALUE=0.0
    {% endif %}
    QUERY_PROBE
  {% endif %}

[gcode_macro _HS_PUSH_TICK]
description: Heat-set: one step of the hot push, or a wait while the insert resists
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% if not st.in_block %}
    { action_raise_error("_HS_PUSH_TICK: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip or st.done %}
  {% elif printer.probe.last_query %}
    _HS_SET WAITS={st.waits + 1}
    {% if st.waits + 1 > st.maxwaits %}
      _HS_ABORT REASON="insert {st.index} still resists after {st.maxwaits} waits"
    {% else %}
      G4 P{(st.wait * 1000)|int}
      QUERY_PROBE
    {% endif %}
  {% elif st.total - st.progress > 0.0001 %}
    {% set d = [st.step, st.total - st.progress]|min %}
    G91
    G1 A{d} F{st.speed * 60}
    G90
    M400
    _HS_SET PROGRESS={st.progress + d}
    QUERY_PROBE
  {% else %}
    _HS_SET DONE=True
  {% endif %}

[gcode_macro _HS_PUSH_END]
description: Heat-set: stop the insert if the push did not finish
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% if not st.in_block %}
    { action_raise_error("_HS_PUSH_END: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip or st.done %}
  {% elif st.total - st.progress <= 0.0001 and not printer.probe.last_query %}
    _HS_SET DONE=True
  {% else %}
    _HS_ABORT REASON="the push of insert {st.index} stopped at {st.progress|round(3)} of {st.total} mm"
  {% endif %}

[gcode_macro HEATSET_UNSHEATH]
description: Heat-set step 7: the mouth up and the follower forward together. DIST= SPEED=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set dist = params.DIST|default(0)|float %}
  {% set speed = params.SPEED|default(1)|float %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_UNSHEATH: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip %}
  {% elif dist <= 0 or dist > lim.max_unsheath %}
    _HS_ABORT REASON="an unsheath of {dist} mm is outside 0 to {lim.max_unsheath} mm"
  {% else %}
    G91
    {% if st.mode == 'normal' %}
      G1 Z{dist} A{dist} F{speed * 60}
    {% else %}
      G1 Z{dist} F{speed * 60}
    {% endif %}
    G90
  {% endif %}

[gcode_macro HEATSET_RETRACT]
description: Heat-set step 8: the follower back, kept as pending for the next push. DIST= SPEED=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set sv = printer.save_variables.variables %}
  {% set dist = params.DIST|default(0)|float %}
  {% set speed = params.SPEED|default(1)|float %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_RETRACT: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip or st.mode != 'normal' %}
  {% elif dist < 0 or dist > lim.max_unsheath %}
    _HS_ABORT REASON="a retract of {dist} mm is outside 0 to {lim.max_unsheath} mm"
  {% elif dist > 0 %}
    G91
    G1 A{0 - dist} F{speed * 60}
    G90
    SAVE_VARIABLE VARIABLE=hs_pending VALUE={sv.hs_pending|default(0.0) + dist}
  {% endif %}

[gcode_macro HEATSET_PRESS]
description: Heat-set step 10: the cold press, then the flush check. SPEED= DWELL= TOL= GUARD=
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set speed = [params.SPEED|default(1)|float, lim.max_speed]|min %}
  {% set dwell = [params.DWELL|default(0)|float, lim.max_wait]|min %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_PRESS: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip %}
  {% elif not st.probed %}
    _HS_ABORT REASON="HEATSET_PRESS ran before the surface was probed"
  {% elif st.mode != 'normal' %}
    G90
    G0 Z{st.s + st.pad_drop} F{speed * 60}
    G4 P{(dwell * 1000)|int}
    _HS_SET PROUD=0.0
  {% else %}
    QUERY_PROBE
    _HS_PRESS_GO SPEED={speed} DWELL={dwell} TOL={params.TOL|default(0)|float} GUARD={params.GUARD|default(0)|float}
  {% endif %}

[gcode_macro _HS_PRESS_GO]
description: Heat-set: press once the float reads open (internal)
gcode:
  {% if printer.probe.last_query %}
    _HS_ABORT REASON="the float reads tripped before the press, stuck float or debris"
  {% else %}
    PROBE SAMPLES=1 PROBE_SPEED={params.SPEED}
    G4 P{(params.DWELL|float * 1000)|int}
    _HS_PRESS_DONE TOL={params.TOL} GUARD={params.GUARD}
  {% endif %}

[gcode_macro _HS_PRESS_DONE]
description: Heat-set: how proud the insert is after the press, and what to do (internal)
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set proud = printer.gcode_move.gcode_position.z - st.z_trip1 %}
  _HS_SET PROUD={proud}
  {% if proud > params.TOL|float %}
    {% if st.on_proud == 'pause' %}
      _HS_PAUSE REASON="insert {st.index} is {proud|round(3)} mm proud, over {params.TOL} mm. Check it, then resume" COLOR=amber
    {% else %}
      _HS_LED COLOR=amber
      RESPOND TYPE=error MSG="Heat-set: insert {st.index} is {proud|round(3)} mm proud, over {params.TOL} mm"
    {% endif %}
  {% elif proud < -(params.GUARD|float) %}
    RESPOND TYPE=error MSG="Heat-set: insert {st.index} pressed {(-proud)|round(3)} mm below the surface. Plastic too soft, or trip_overtravel wrong"
  {% endif %}

[gcode_macro HEATSET_INSERT_DONE]
description: Heat-set step 11: count the insert out of the magazine and log it
gcode:
  {% set st = printer["gcode_macro _HS_STATE"] %}
  {% set sv = printer.save_variables.variables %}
  {% set left = sv.hs_count|default(0) - 1 %}
  {% if not st.in_block %}
    { action_raise_error("HEATSET_INSERT_DONE: outside HEATSET_BEGIN and HEATSET_END") }
  {% endif %}
  {% if st.skip %}
    RESPOND MSG="Heat-set: insert {st.index} skipped"
  {% elif st.mode != 'normal' %}
    RESPOND MSG="Heat-set: insert {st.index} rehearsed at X{st.x} Y{st.y}"
  {% else %}
    SAVE_VARIABLE VARIABLE=hs_count VALUE={left}
    _HS_LED COLOR=green
    RESPOND MSG="Heat-set: insert {st.index} {st.key} X{st.x} Y{st.y}, surface {(st.s - st.z_top)|round(3)}, waits {st.waits}, proud {st.proud|round(3)}, {left} left"
  {% endif %}
  _HS_SET LEFT={st.left - 1} SKIP=False

# --- By hand --------------------------------------------------------------------------------

[gcode_macro HEATSET_REFILL]
description: Heat-set: tell the macros what the magazine holds. KEY= COUNT=
gcode:
  {% if not params.KEY or params.COUNT is not defined or params.COUNT|int < 0 %}
    { action_raise_error("HEATSET_REFILL: KEY and COUNT (0 or more) are required") }
  {% endif %}
  SAVE_VARIABLE VARIABLE=hs_key VALUE='"{params.KEY}"'
  SAVE_VARIABLE VARIABLE=hs_count VALUE={params.COUNT|int}
  RESPOND MSG="Heat-set: the magazine holds {params.COUNT|int} {params.KEY}"

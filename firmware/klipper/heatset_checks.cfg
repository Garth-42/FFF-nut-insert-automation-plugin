# Heat-set tool: bring-up checks for Klipper. Optional; nothing in a print calls them.
#   [include heatset_checks.cfg]       after heatset_limits.cfg and heatset_macros.cfg
# firmware/klipper/README.md says when to run each. There is no probe check here: Klipper's
# PROBE has no travel limit, so try PROBE by hand, with the pad a few mm over a plate.

[gcode_macro HEATSET_CHECK_FLOAT]
description: Heat-set bring-up: say whether the float reads open or tripped now
gcode:
  QUERY_PROBE
  _HS_CHECK_FLOAT_SAY

[gcode_macro _HS_CHECK_FLOAT_SAY]
description: Heat-set bring-up: report the float after QUERY_PROBE (internal)
gcode:
  RESPOND MSG="Heat-set float: reads {'TRIPPED' if printer.probe.last_query else 'open'}. Expect open when free, tripped when pushed up by hand, and tripped when unplugged"

[gcode_macro HEATSET_CHECK_FOLLOWER]
description: Heat-set bring-up: move the follower DIST mm forward and back at SPEED mm/s
gcode:
  {% set lim = printer["gcode_macro _HS_LIMITS"] %}
  {% set dist = params.DIST|default(1)|float %}
  {% set speed = params.SPEED|default(1)|float %}
  {% if dist <= 0 or dist > lim.max_push or speed <= 0 %}
    { action_raise_error("HEATSET_CHECK_FOLLOWER: DIST must be over 0 and at most " ~ lim.max_push ~ " mm, SPEED over 0") }
  {% endif %}
  {% if 'A' not in printer.gcode_move.axis_map %}
    MANUAL_STEPPER STEPPER={lim.follower} GCODE_AXIS=A
  {% endif %}
  G91
  G1 A{dist} F{speed * 60}
  G1 A{0 - dist} F{speed * 60}
  G90
  M400
  RESPOND MSG="Heat-set follower: moved {dist} mm forward and back. +A must push the stack toward the mouth"
